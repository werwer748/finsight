name: review-code

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-code-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review-code:
    # 포크 PR은 시크릿을 받지 못하므로 건너뛴다.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      decision: ${{ steps.review.outputs.decision }}
    steps:
      - uses: actions/checkout@v6
        with:
          # 스킬이 origin/<base>와의 merge-base를 계산한다.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Review
        id: review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
        # 보고를 작업 폴더에 쓰면 스킬이 추적되지 않는 새 파일로 보고 리뷰 대상에 넣는다.
        run: python3 scripts/review_gate.py --base "origin/$BASE_REF" --fail-on warning --strict --decision-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/review.md"
      - name: Comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file "$RUNNER_TEMP/review.md" --edit-last --create-if-none
      # 사유는 위 댓글 끝의 머지 판정 줄에 있다. 여기서 댓글을 따로 달면 다음 실행의 --edit-last가 그 댓글을 덮어쓴다.
      - name: Close
        if: always() && steps.review.outputs.decision == 'reject'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr close ${{ github.event.pull_request.number }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  auto-merge:
    # 리뷰 판정이 merge이고 lint·build·test까지 통과한 PR만 머지한다.
    needs: [review-code, test]
    if: ${{ needs.review-code.outputs.decision == 'merge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 쓰기 권한 토큰은 Claude가 도는 job에 주지 않고 이 job에만 준다.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          # 리뷰 규칙·게이트·CI 설정. 이걸 고친 PR은 고친 판으로 자기 자신을 심사한 것이므로 사람이 머지한다.
          # 이 검사는 PR이 함께 고칠 수 있는 scripts/에 두지 않고 여기에 둔다.
          PROTECTED: '^(\.github/|\.githooks/|\.claude/|scripts/|CLAUDE\.md$|package\.json$)'
        run: |
          files=$(gh pr diff "$PR_URL" --name-only)
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qE "$PROTECTED"; then
            echo "::notice::리뷰·CI 설정을 고친 PR이라 자동 머지하지 않습니다. 직접 머지하세요."
            exit 0
          fi
          # 리뷰한 뒤에 base 브랜치가 바뀌었으면 머지하지 않는다.
          if [ "$(gh pr view "$PR_URL" --json baseRefName --jq .baseRefName)" != "$BASE_REF" ]; then
            echo "::notice::리뷰한 뒤 base 브랜치가 바뀌어 자동 머지하지 않습니다."
            exit 0
          fi
          # 리뷰한 커밋 뒤에 push가 있었으면 머지하지 않는다.
          gh pr merge "$PR_URL" --merge --match-head-commit "$HEAD_SHA"
