name: review-code

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-code-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review-code:
    # 포크 PR은 시크릿을 받지 못하므로 건너뛴다.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      decision: ${{ steps.review.outputs.decision }}
    steps:
      - uses: actions/checkout@v6
        with:
          # 스킬이 origin/<base>와의 merge-base를 계산한다.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Review
        id: review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
        # 보고를 작업 폴더에 쓰면 스킬이 추적되지 않는 새 파일로 보고 리뷰 대상에 넣는다.
        run: python3 scripts/review_gate.py --base "origin/$BASE_REF" --fail-on warning --strict --decision-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/review.md"
      - name: Comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file "$RUNNER_TEMP/review.md" --edit-last --create-if-none
      # 사유는 위 댓글 끝의 머지 판정 줄에 있다. 여기서 댓글을 따로 달면 다음 실행의 --edit-last가 그 댓글을 덮어쓴다.
      - name: Close
        if: always() && steps.review.outputs.decision == 'reject'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr close ${{ github.event.pull_request.number }}

  test:
    # 시크릿을 쓰지 않으므로 draft와 포크 PR에서도 돈다.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  oncall:
    # test job(lint·build·test)이 실패했을 때만 깨어난다. 리뷰 판정의 실패는 다루지 않는다.
    # draft, 포크, 봇이 열었거나 일으킨 PR, on-call이 만든 브랜치는 건너뛴다. 나머지 가드는 scripts/oncall.py의 skip_reason에 있다.
    needs: test
    if: >-
      ${{ failure() && needs.test.result == 'failure'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.head_ref, 'oncall/')
      && github.event.pull_request.user.type != 'Bot'
      && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 에이전트가 도는 job에는 읽기 권한만 준다. 수정 PR은 oncall-publish가 연다.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      step: ${{ steps.prepare.outputs.step }}
      handoff: ${{ steps.handoff.outputs.handoff }}
    steps:
      - uses: actions/checkout@v6
        with:
          # test job은 base와 합친 커밋에서 돌지만 수정은 PR 브랜치 위에 얹는다.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare
        id: prepare
        env:
          # 실패 로그를 받는 이 단계에만 준다.
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        # 기본 셸에는 pipefail이 없어 tee로 이으면 스크립트의 실패가 묻힌다.
        shell: bash
        run: |
          # 이 기능이 들어오기 전에 딴 브랜치에는 스크립트와 스킬이 없다.
          if [ ! -f scripts/oncall.py ] || [ ! -f .claude/skills/oncall/SKILL.md ]; then
            echo "on-call: 이 브랜치에는 on-call 도구가 없어 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/oncall.py prepare "$RUN_ID" --output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v6
        if: steps.prepare.outputs.ready == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.prepare.outputs.ready == 'true'
      - name: Reproduce
        id: reproduce
        if: steps.prepare.outputs.ready == 'true'
        run: |
          # PR 브랜치만으로 통과하면 base와 합친 상태에서만 깨지거나 일시적인 실패다. 여기서는 고칠 수 없다.
          if npm run lint && npm run build && npm run test; then
            echo "on-call: PR 브랜치만으로는 실패가 재현되지 않아 건너뜁니다. base와 합친 상태에서만 깨지거나 일시적인 실패입니다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install agent
        if: steps.reproduce.outputs.failed == 'true'
        run: |
          # 아래 Fix 단계의 CLAUDE_CODE_SUBPROCESS_ENV_SCRUB은 Linux에서 bubblewrap이 있어야 켜진다. 없으면 claude가 시작하지 않는다.
          # socat이 없으면 claude는 시작하지만 세션 안의 Bash 도구가 뜨지 않아 에이전트가 테스트를 돌리지 못한다.
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat
          # ubuntu-24.04는 AppArmor가 권한 없는 사용자 네임스페이스를 막아 bubblewrap이 "Permission denied"로 죽는다.
          # 러너는 한 번 쓰고 버리고 job 안에서 sudo가 되므로 이 제한을 풀어도 잃는 경계가 없다.
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # 격리가 안 되는 러너에서는 에이전트를 띄우지 않고 여기서 멈춘다.
          bwrap --unshare-pid --ro-bind / / --proc /proc --dev /dev true
          npm install -g @anthropic-ai/claude-code
      - name: Fix
        if: steps.reproduce.outputs.failed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Bash 도구와 훅이 띄우는 프로세스의 환경에서 자격 증명을 지우고, /proc으로도 읽지 못하게 격리한다.
          # 에이전트가 돌리는 테스트는 의존성 코드를 실행한다. 이 값이 없으면 그 코드가 토큰을 물려받는다.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
          # scripts/tdd_guard.py가 이 값을 보고 통과시킨다. 실패한 CI가 이미 결함을 드러냈다.
          ONCALL_ACTIVE: 1
        # 저장소가 공개라 Actions 로그는 누구나 본다. 에이전트가 쓴 글은 로그에 찍지 않고 실행 정보만 남긴다.
        run: |
          timeout 20m claude -p "/oncall ci" --output-format json --permission-mode dontAsk \
            --allowedTools Edit Write "Bash(npm run lint)" "Bash(npm run build)" "Bash(npm run test)" \
            < /dev/null > "$RUNNER_TEMP/agent.json" 2> "$RUNNER_TEMP/agent.err" || {
              echo "::warning::on-call 에이전트가 오류로 끝났습니다."
              # 시작하지 못한 이유를 알 수 있게 CLI의 오류 줄만 남긴다.
              grep -a -i -m 5 '^error' "$RUNNER_TEMP/agent.err" | cut -c1-300 || true
            }
          jq -r '"on-call 에이전트: \(.subtype) · \(.num_turns)턴 · \(.duration_ms)ms"' "$RUNNER_TEMP/agent.json" || true
      - name: Handoff
        id: handoff
        if: steps.reproduce.outputs.failed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/oncall"
          if [ -f .oncall/report.md ]; then cp .oncall/report.md "$RUNNER_TEMP/oncall/report.md"; fi
          # 에이전트가 남긴 변경을 먼저 묶어 두고, lint·build·test를 다시 통과한 것만 패치로 넘긴다.
          # 제외 pathspec(':!.oncall')은 그 폴더가 무시 대상이면 git add를 실패시키므로 쓰지 않는다.
          git add -A
          git rm -r -q --cached --ignore-unmatch .oncall
          if ! git diff --cached --quiet HEAD && npm run lint && npm run build && npm run test; then
            git diff --cached HEAD > "$RUNNER_TEMP/oncall/fix.patch"
          fi
          # 끝까지 돈 에이전트는 고치지 않았더라도 보고서를 남긴다. 아무것도 없으면 on-call 자체가 고장 난 것이다.
          if [ -z "$(ls -A "$RUNNER_TEMP/oncall")" ]; then
            echo "::error::on-call 에이전트가 보고서도 수정도 남기지 않았습니다."
            exit 1
          fi
          echo "handoff=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.handoff.outputs.handoff == 'true'
        with:
          name: oncall
          path: ${{ runner.temp }}/oncall
          # 공개 저장소의 artifact는 로그인한 누구나 받을 수 있다.
          retention-days: 1

  oncall-publish:
    # 조상인 test가 실패했으므로 상태 함수가 없으면 건너뛰어진다.
    needs: oncall
    if: ${{ !cancelled() && needs.oncall.result == 'success' && needs.oncall.outputs.handoff == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 쓰기 권한 토큰은 이 job에만 준다. 에이전트도 패키지 스크립트도 돌리지 않고, 넘겨받은 보고와 패치는 데이터로만 다룬다.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # 수정 브랜치를 push해야 하므로 여기서는 자격 증명을 남긴다.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: oncall
          path: ${{ runner.temp }}/oncall
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # 브랜치와 커밋은 artifact가 아니라 이벤트에서 가져온다.
          BASE: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository }}
          STEP: ${{ needs.oncall.outputs.step }}
        # 보고는 스크립트가 시크릿을 가린 뒤 출력한다. 기본 셸에는 pipefail이 없어 tee로 이으면 스크립트의 실패가 묻힌다.
        shell: bash
        run: |
          python3 scripts/oncall.py publish "$RUNNER_TEMP/oncall" --base "$BASE" --sha "$HEAD_SHA" --pr "$PR_NUMBER" \
            --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" --repo "$REPO" --step "$STEP" | tee -a "$GITHUB_STEP_SUMMARY"

  auto-merge:
    # 리뷰 판정이 merge이고 lint·build·test까지 통과한 PR만 머지한다.
    # 기본 브랜치로 가는 PR만 다룬다. base가 다른 PR을 리뷰한 뒤 base를 바꿔 리뷰하지 않은 커밋을 넣지 못하게 한다.
    # on-call이 연 수정 PR은 머지하지 않는다. base 브랜치가 지워지면 그 PR의 base가 기본 브랜치로 바뀐다.
    needs: [review-code, test]
    if: ${{ needs.review-code.outputs.decision == 'merge' && github.base_ref == github.event.repository.default_branch && !startsWith(github.head_ref, 'oncall/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 쓰기 권한 토큰은 Claude가 도는 job에 주지 않고 이 job에만 준다.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          # 리뷰 규칙·게이트·에이전트 훅·CI 설정과 의존성. 앞의 것을 고친 PR은 고친 판으로 자기 자신을 심사한 것이고,
          # lockfile은 리뷰어가 읽지 않는다. 그래서 사람이 머지한다. docs/와 앱 설정 파일은 리뷰어가 읽으므로 넣지 않는다.
          # PR의 워크플로우는 PR 쪽 판으로 돌기 때문에 이 검사도 PR이 고칠 수 있다. 그런 PR을 막는 것은 이 검사가 아니라
          # GITHUB_TOKEN에 workflows 권한이 없어 워크플로우 파일을 고친 PR을 머지할 수 없다는 GitHub의 제한이다.
          # 목록을 바꾸면 CLAUDE.md의 "개발 프로세스"도 고친다.
          PROTECTED: '^(\.github/|\.githooks/|\.claude/|\.codex/|scripts/|package\.json$|package-lock\.json$|\.npmrc$)|(^|/)CLAUDE(\.local)?\.md$'
        run: |
          # 옮긴 파일은 옛 경로도 본다. 이 API는 3000개까지만 주므로 그만큼 큰 PR은 머지하지 않는다.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
          if [ -z "$files" ] || [ "${CHANGED_FILES:-3000}" -ge 3000 ] || printf '%s\n' "$files" | grep -qE "$PROTECTED"; then
            echo "::notice::리뷰·CI 설정이나 의존성을 고친 PR이라 자동 머지하지 않습니다. 직접 머지하세요."
            exit 0
          fi
          # 리뷰한 커밋 뒤에 push가 있었으면 머지하지 않는다.
          gh pr merge "$PR_URL" --merge --match-head-commit "$HEAD_SHA"
